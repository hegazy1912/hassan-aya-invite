<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>رسايل الفرح — حسن &amp; آية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cairo:wght@300;400;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="letters.css">
<script src="config.js"></script>
<style>
:root{--gold:#d8b878;--cream:#f8f1e4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#04060d;color:var(--cream);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 78% 8%,rgba(38,52,88,.26),transparent 52%),radial-gradient(ellipse at 15% 14%,rgba(54,34,76,.28),transparent 54%),
  linear-gradient(180deg,#010207 0%,#03060f 38%,#06080f 64%,#0e0b10 100%)}
.bg i{position:absolute;border-radius:50%;background:#dfe8ff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
.bg .moon{position:absolute;top:7%;right:9%;width:clamp(60px,9vw,110px);height:clamp(60px,9vw,110px);border-radius:50%;animation:none;
  background:radial-gradient(circle at 34% 28%,#fffdf7,#f1e2bf 55%,#cdb58a);box-shadow:0 0 70px rgba(255,238,200,.3),0 0 160px rgba(255,232,180,.14);opacity:.9}
.petals{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-8%;border-radius:60% 20% 60% 20%;background:radial-gradient(circle at 35% 35%,rgba(255,214,224,.9),rgba(255,170,190,.35) 70%);filter:blur(1px);animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translate3d(60px,112vh,0) rotate(320deg);opacity:0}}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 40%,rgba(1,2,5,.85) 100%)}

.app{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(14px,4vw,34px);gap:12px}
.mono{font-family:"Cormorant Garamond",serif;font-size:24px;letter-spacing:.08em;color:var(--gold);white-space:nowrap}
.mono i{font-style:italic;color:var(--cream);padding:0 2px}
.ttl{font-size:12px;letter-spacing:2px;color:rgba(248,241,228,.55)}
.cnt{font-size:12px;letter-spacing:1px;color:rgba(248,241,228,.7);min-width:90px;text-align:left}
.cnt b{color:#ffe9b0;font-weight:600}
.main{flex:1;min-height:0;display:grid;place-items:center;position:relative;padding:0 10px}
.wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:320px;transform-origin:0 0}
.lab{position:absolute;left:0;right:0;text-align:center;font-size:12px;letter-spacing:2px;color:rgba(248,241,228,.55);pointer-events:none}
.hint{font-size:12px;letter-spacing:2px;color:rgba(248,241,228,.55);text-align:center;margin-top:6px;min-height:20px;transition:opacity .4s}
.bar{height:3px;margin:0 clamp(14px,6vw,60px);border-radius:3px;background:rgba(248,241,228,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d8b878,#ffe9b0);transition:width .6s cubic-bezier(.3,.7,.2,1)}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.ibtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:rgba(248,241,228,.8);
  background:rgba(10,14,26,.4);border:1px solid rgba(216,184,120,.3);backdrop-filter:blur(6px);transition:.25s}
.ibtn:hover{border-color:rgba(216,184,120,.8);color:#fff;background:rgba(216,184,120,.12)}
.ibtn:active{transform:scale(.92)}
.ibtn:disabled{opacity:.3;cursor:default;pointer-events:none}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.ibtn.nx:hover svg{transform:translateX(-4px)}.ibtn.pv:hover svg{transform:translateX(4px)}
.go{min-width:150px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.5px;padding:13px 28px;border-radius:999px;cursor:pointer;
  background:rgba(216,184,120,.94);border:1px solid rgba(216,184,120,.94);color:#1a1208;transition:.25s}
.go:hover{background:#eccf98;transform:translateY(-1px)}
.go:disabled{opacity:.5;cursor:default}
.go.pulse{animation:goPulse 2s ease-in-out infinite}
@keyframes goPulse{50%{box-shadow:0 0 0 8px rgba(216,184,120,.14),0 0 30px rgba(216,184,120,.35)}}
.hintSeal .lt-seal{animation:sealBeat 1.8s ease-in-out infinite}
@keyframes sealBeat{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25) drop-shadow(0 0 8px rgba(255,120,140,.7))}}

/* شاشات الحالات */
.screen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
.screen[hidden]{display:none}
.screen h2{font-size:clamp(20px,4.6vw,28px);font-weight:600;margin:14px 0 6px;color:#fdf6e9}
.screen p{font-size:13px;line-height:1.9;color:rgba(248,241,228,.62);max-width:420px;margin:0 auto}
.pinBox{display:grid;gap:12px;justify-items:center;width:min(320px,84vw);margin:16px auto 0}
#pinInput{width:100%;text-align:center;font-family:inherit;font-size:24px;letter-spacing:12px;padding:14px 12px;border-radius:16px;
  background:rgba(10,14,26,.6);border:1px solid rgba(216,184,120,.4);color:#fdf6e9;outline:none;direction:ltr}
#pinInput:focus{border-color:rgba(216,184,120,.9);box-shadow:0 0 0 3px rgba(216,184,120,.15)}
#pinErr{font-size:12px;color:#ffd9a0;min-height:16px}
.fan{position:relative;width:260px;height:190px;margin:0 auto}
.fan .lt-grp{left:30px;top:30px}
.lock{position:absolute;left:50%;top:46%;width:74px;height:74px;margin:-37px 0 0 -37px;z-index:20;cursor:pointer;filter:drop-shadow(0 8px 18px rgba(0,0,0,.6))}
.lock svg{width:100%;height:100%;overflow:visible}
.lock.shake{animation:lkShake .6s}
@keyframes lkShake{15%,55%{transform:translateX(-8px) rotate(-6deg)}35%,75%{transform:translateX(8px) rotate(6deg)}}
.cd{display:flex;gap:10px;justify-content:center;margin:18px 0 8px;direction:ltr}
.cd div{min-width:62px;padding:10px 6px;border-radius:14px;border:1px solid rgba(216,184,120,.3);background:linear-gradient(180deg,rgba(24,20,28,.9),rgba(10,9,15,.95))}
.cd b{display:block;font-size:26px;font-weight:600;color:#ffe9b0;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;letter-spacing:2px;color:rgba(248,241,228,.5)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,14px);z-index:30;pointer-events:none;
  background:rgba(8,12,22,.92);border:1px solid rgba(216,184,120,.4);padding:10px 22px;border-radius:999px;font-size:12px;letter-spacing:1px;opacity:0;transition:.4s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.end{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:10;pointer-events:none}
.end[hidden]{display:none}
.end>div{pointer-events:auto}
@media(max-width:480px){.ttl{display:none}.go{min-width:130px;padding:12px 20px}}
@media(prefers-reduced-motion:reduce){.bg i,.petals i{animation:none}}
</style>
</head>
<body>
<div class="bg" id="bg"><div class="moon"></div></div>
<div class="petals" id="petals"></div>
<div class="vig"></div>

<div class="app" id="app">
  <div class="top">
    <div class="mono">H<i>&amp;</i>A</div>
    <div class="ttl" id="ttl">رسايل الفرح</div>
    <div class="cnt" id="cnt"></div>
  </div>

  <div class="main" id="main">
    <div class="wrap" id="wrap"><div id="stage"></div></div>

    <div class="screen" id="sLoad"><div><p>بنجهّز الصندوق…</p></div></div>
    <div class="screen" id="sErr" hidden><div><h2 id="eT">في مشكلة</h2><p id="eP"></p></div></div>
    <div class="screen" id="sEmpty" hidden><div><div style="font-size:54px">💌</div><h2>الصندوق لسه فاضي</h2><p>محدش سابلكم رسالة لسه. ارجعوا بعد شوية.</p></div></div>
    <div class="screen" id="sLock" hidden>
      <div>
        <div class="fan" id="fan"></div>
        <div class="lock" id="lockBtn" title="مقفول">
          <svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3d2"/><stop offset=".5" stop-color="#d8b878"/><stop offset="1" stop-color="#9a7428"/></linearGradient></defs>
            <path d="M20 28v-7a12 12 0 0 1 24 0v7" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"/>
            <rect x="12" y="27" width="40" height="30" rx="7" fill="url(#lg)"/>
            <circle cx="32" cy="40" r="4.2" fill="#3a2608"/><rect x="30.2" y="42" width="3.6" height="8" rx="1.6" fill="#3a2608"/></svg>
        </div>
        <h2>الرسايل مقفولة لحد بعد الفرح 🔒</h2>
        <p id="lockP"></p>
        <div class="cd" id="cd"><div><b id="cdD">٠</b><span>يوم</span></div><div><b id="cdH">٠</b><span>ساعة</span></div><div><b id="cdM">٠</b><span>دقيقة</span></div><div><b id="cdS">٠</b><span>ثانية</span></div></div>
      </div>
    </div>
    <div class="screen" id="sPin" hidden>
      <div>
        <div style="font-size:44px">🔐</div>
        <h2>اكتب الـPIN</h2>
        <p>الـPIN اللي وصلك في رسالة منفصلة مع اللينك. مش مكتوب في اللينك نفسه.</p>
        <div class="pinBox">
          <input id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
          <button class="go" id="pinGo">افتح الرسايل</button>
          <p id="pinErr"></p>
        </div>
      </div>
    </div>
    <div class="end" id="sEnd" hidden>
      <div><div style="font-size:54px">💛</div><h2 style="font-size:24px;margin:10px 0 6px">خلصت الرسايل</h2><p id="endP" style="color:rgba(248,241,228,.7);font-size:13px"></p>
        <div style="margin-top:16px"><button class="go" id="again">من الأول</button></div></div>
    </div>
  </div>

  <div class="hint" id="hint"></div>
  <div class="bar" id="bar"><i id="barI"></i></div>
  <div class="ctl" id="ctl">
    <button class="ibtn pv" id="prev" aria-label="اللي قبلها"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="go pulse" id="go">افتح الظرف</button>
    <button class="ibtn nx" id="next" aria-label="اللي بعدها"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="letters.js"></script>
<script>
(function(){
'use strict';
var GIFT=window.GIFT||{};
var qs=new URLSearchParams(location.search);
var hp=new URLSearchParams(String(location.hash||'').replace(/^#/,''));
var DEMO=qs.get('demo')==='1', DEMO_LOCKED=qs.get('locked')==='1';
var API=String(GIFT.RSVP_URL||'').trim()||String(hp.get('e')||'').trim();
var KEY=String(hp.get('k')||qs.get('k')||'').trim();
var PIN_KEY='gift.msgpin.'+KEY;
var PIN='';try{PIN=sessionStorage.getItem(PIN_KEY)||'';}catch(e){}
var $=function(id){return document.getElementById(id);};
var A=LET.A, sleep=LET.sleep, ar=function(n){try{return Number(n).toLocaleString('ar-EG');}catch(e){return String(n);}};

/* ---------- خلفية ---------- */
(function(){
  var bg=$('bg');
  for(var i=0;i<70;i++){var s=document.createElement('i'),r=Math.random()*1.6+.4;
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*78+'%;width:'+r+'px;height:'+r+'px;animation-delay:'+(-Math.random()*4)+'s;animation-duration:'+(2.5+Math.random()*3)+'s';bg.appendChild(s);}
  var pt=$('petals');
  for(var j=0;j<14;j++){var p=document.createElement('i'),z=6+Math.random()*10;
    p.style.cssText='width:'+z+'px;height:'+z*.8+'px;left:'+Math.random()*100+'%;opacity:'+(.2+Math.random()*.4)+';animation-duration:'+(11+Math.random()*14)+'s;animation-delay:'+(-Math.random()*18)+'s';pt.appendChild(p);}
})();
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('on');},2600);}
function show(id){['sLoad','sErr','sEmpty','sLock','sPin'].forEach(function(k){$(k).hidden=(k!==id);});}
function hideAll(){show('');}
function fail(t,p){$('eT').textContent=t;$('eP').textContent=p||'';show('sErr');setUI(false);}

/* ---------- API ---------- */
function jsonp(params){
  return new Promise(function(resolve,reject){
    if(!API)return reject(new Error('noapi'));
    var cb='msgcb'+Math.random().toString(36).slice(2),q=new URLSearchParams(params);q.set('callback',cb);q.set('t',Date.now());
    var s=document.createElement('script'),done=false;
    function fin(e,d){if(done)return;done=true;clearTimeout(to);try{delete window[cb];}catch(x){}try{s.remove();}catch(x){}e?reject(e):resolve(d||{});}
    var to=setTimeout(function(){fin(new Error('timeout'));},20000);
    window[cb]=function(d){fin(null,d);};s.onerror=function(){fin(new Error('network'));};
    s.src=API+(API.indexOf('?')>=0?'&':'?')+q.toString();document.head.appendChild(s);
  });
}
var DEMO_MSGS=[
 {name:'محمود',c:'cream',text:'ألف مبروك يا حسن يا صاحبي! ربنا يتمم لكم على خير وتفضلوا فرحانين دايمًا. وبالمناسبة، متنسوش النقطة 😂'},
 {name:'سارة',c:'rose',text:'يا آية، حسن محظوظ بيكي. أنا أول من شافك بتضحكي معاه وعرفت إن الحكاية دي هتكمل. بحبكم ❤️'},
 {name:'عمر',c:'sky',text:'نصيحة من واحد جرّب: الست دايمًا صح، وإن كانت غلطانة ارجع للقاعدة الأولى 😅 مبروك يا باشا!'},
 {name:'ماما نجلاء',c:'mint',text:'ربنا يبارك لكم ويسعدكم يا حبايبي، وتفضلوا دايمًا إيد واحدة. اللهم بارك.'},
 {name:'كريم',c:'cream',text:'فاكر أول مرة قلتلي إنك هتتجوز؟ ضحكت عليك. دلوقتي بتقدم لك الشاي في فرحك. ألف مبروك 🎉'}
];
function loadData(pin){
  if(DEMO){
    var arr=DEMO_MSGS.slice();
    try{(JSON.parse(localStorage.getItem('gift.demo.msgs')||'[]')).forEach(function(m){arr.push({name:m.name,c:m.c,text:m.text});});}catch(e){}
    var now=Date.now();
    return Promise.resolve({ok:true,locked:DEMO_LOCKED,unlockAt:new Date(now+((2*24+5)*3600+13*60)*1000).toISOString(),now:new Date(now).toISOString(),count:arr.length,messages:DEMO_LOCKED?[]:arr});
  }
  if(!API)return Promise.reject(new Error('noapi'));
  if(!KEY)return Promise.reject(new Error('nokey'));
  return jsonp({action:'msgs',key:KEY,pin:pin||''});
}

/* ---------- حالة العرض ---------- */
var S={msgs:[],i:0,open:false,busy:false,cur:null,H:0,scale:1};
var ENVW=300,ENVH=186,PW=264,PAD=22,FS=17.5,LH=28,SW=320;
function setUI(on){$('ctl').style.display=on?'':'none';$('bar').style.visibility=on?'':'hidden';$('cnt').style.visibility=on?'':'hidden';$('hint').textContent='';if(!on){$('stage').innerHTML='';S.cur=null;}}
function measure(text,name){
  var d=document.createElement('div');
  d.style.cssText='position:absolute;visibility:hidden;left:-9999px;top:0;direction:rtl;white-space:pre-wrap;overflow-wrap:anywhere;width:'+PW+'px;padding:'+PAD+'px;font-family:"Aref Ruqaa","Cairo",serif;font-size:'+FS+'px;line-height:'+LH+'px';
  d.textContent=text;document.body.appendChild(d);var h=d.scrollHeight;d.remove();
  h+=(name?LH*1.6:0)+10;
  h=Math.max(186,Math.min(396,Math.ceil(h/3)*3));return h;
}
function fit(H){
  var vw=window.innerWidth,vh=window.innerHeight,mainH=$('main').clientHeight||(vh-190);
  var s=Math.min(1.12,(vw-24)/SW,(mainH-16)/(H+ENVH-40));s=Math.max(.5,s);S.scale=s;
  var w=$('wrap');w.style.width=(SW*s)+'px';w.style.height=((H+ENVH-40)*s)+'px';
  var st=$('stage');st.style.transform='scale('+s+')';st.style.height=(H+ENVH-40)+'px';
}
function build(i){
  var m=S.msgs[i],theme=LET.themes[m.c]?m.c:'cream',H=measure(m.text,m.name);
  S.H=H;S.IN=16+Math.round(2*H/3);S.open=false;
  var st=$('stage');st.innerHTML='';fit(H);
  var env=LET.envelope({w:ENVW,h:ENVH,theme:theme,seal:52});
  env.el.style.left=((SW-ENVW)/2)+'px';env.el.style.top=(H-40)+'px';
  var paper=LET.paper({w:PW,h:H,theme:theme,lh:LH,pad:PAD});
  paper.el.style.left=((ENVW-PW)/2)+'px';paper.el.style.top=(40-H)+'px';
  env.add(paper.el);
  paper.prepareWrite(m.text,m.name?'— '+m.name:'',FS,LH,PAD);
  paper.setFolded();paper.el.style.transform='translateY('+S.IN+'px)';
  env.setFlapOpen(false);env.sealShow();
  st.appendChild(env.el);
  S.cur={env:env,paper:paper,m:m};
  return S.cur;
}
function label(){
  $('cnt').innerHTML='الظرف <b>'+ar(S.i+1)+'</b> من '+ar(S.msgs.length);
  $('barI').style.width=(((S.i+(S.open?1:.35))/S.msgs.length)*100)+'%';
}
function setBtn(){
  var g=$('go');
  g.textContent=S.open?(S.i>=S.msgs.length-1?'خلصنا':'الظرف اللي بعده'):'افتح الظرف';
  g.classList.toggle('pulse',!S.open);
  $('prev').disabled=S.busy||S.i<=0;$('next').disabled=S.busy||S.i>=S.msgs.length-1&&!S.open;
  g.disabled=S.busy;
  $('stage').classList.toggle('hintSeal',!S.open&&!S.busy);
  $('hint').textContent=S.open?'':'دوس على الظرف أو الزرار يتفتح';
}
function enter(dir){
  var el=S.cur.env.el,x=dir*430;
  return A(el,[{opacity:0,transform:'translate('+x+'px,60px) rotate('+(dir*14)+'deg) scale(.8)'},
    {opacity:1,transform:'translate('+(-dir*16)+'px,-6px) rotate('+(-dir*1.5)+'deg) scale(1.02)',offset:.72},
    {opacity:1,transform:'translate(0,0) rotate(0) scale(1)'}],860,'cubic-bezier(.2,.8,.3,1)');
}
function exit(dir){
  var el=S.cur.env.el,x=-dir*430;
  return A(el,[{opacity:1,transform:'translate(0,0) rotate(0) scale(1)'},{opacity:0,transform:'translate('+x+'px,40px) rotate('+(-dir*12)+'deg) scale(.82)'}],560,'cubic-bezier(.5,0,.8,.4)');
}
async function openEnv(){
  if(S.busy||S.open||!S.cur)return;S.busy=true;setBtn();
  var c=S.cur,env=c.env,paper=c.paper;LET.sfx.unlock();
  $('stage').classList.remove('hintSeal');
  var br=env.sealBreak();await sleep(260);
  env.glow(true,600);
  await env.flapTo(true,560);
  LET.sfx.paper('rustle');
  await A(paper.el,[{transform:'translateY('+S.IN+'px)'},{transform:'translateY(0px)'}],780,'cubic-bezier(.3,.7,.2,1)');
  LET.sfx.paper('rustle');await paper.unfoldT(480);await paper.unfoldB(480);
  var r=paper.el.getBoundingClientRect();
  LET.confetti(r.left+r.width/2,r.top+10,34,{power:330});LET.sfx.chime();
  paper.writeEl.style.opacity='1';
  await Promise.all([paper.reveal(),br]);
  S.open=true;S.busy=false;label();setBtn();
}
async function closeEnv(){
  if(S.busy||!S.open||!S.cur)return;S.busy=true;setBtn();
  var c=S.cur,env=c.env,paper=c.paper;
  await paper.hideWrite(240);
  LET.sfx.paper('rustle');await paper.foldB(380);await paper.foldT(380);
  await A(paper.el,[{transform:'translateY(0px)'},{transform:'translateY('+S.IN+'px)'}],560,'cubic-bezier(.5,0,.3,1)');
  env.glow(false,300);LET.sfx.paper('rustle');
  await env.flapTo(false,480);
  await env.sealStamp();
  S.open=false;S.busy=false;label();setBtn();
}
async function go(delta){
  if(S.busy)return;
  var ni=S.i+delta;
  if(ni<0)return;
  if(S.open)await closeEnv();
  if(ni>=S.msgs.length){S.busy=true;setBtn();await exit(1);$('stage').innerHTML='';S.cur=null;endScreen();S.busy=false;return;}
  S.busy=true;setBtn();
  var dir=delta>0?1:-1;
  await exit(dir);
  S.i=ni;build(S.i);label();
  await enter(dir);
  S.busy=false;label();setBtn();
}
function endScreen(){
  $('endP').textContent='قريتوا '+ar(S.msgs.length)+' رسالة من الناس اللي بتحبكم 💌';
  $('sEnd').hidden=false;$('hint').textContent='';$('ctl').style.display='none';$('barI').style.width='100%';
  var r=$('sEnd').getBoundingClientRect();LET.confetti(r.left+r.width/2,r.top+r.height/2,60,{power:380});LET.sfx.chime();
}
$('again').onclick=function(){$('sEnd').hidden=true;$('ctl').style.display='';S.i=0;build(0);label();S.busy=true;setBtn();enter(1).then(function(){S.busy=false;setBtn();});};
$('go').onclick=function(){LET.sfx.unlock();S.open?go(1):openEnv();};
$('next').onclick=function(){LET.sfx.unlock();go(1);};
$('prev').onclick=function(){LET.sfx.unlock();go(-1);};
$('stage').addEventListener('click',function(){if(S.busy)return;S.open?closeEnv():openEnv();});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')go(1);else if(e.key==='ArrowRight')go(-1);else if(e.key===' '||e.key==='Enter'){e.preventDefault();$('go').click();}
});
(function(){var x0=null;var st=$('main');
  st.addEventListener('pointerdown',function(e){x0=e.clientX;});
  st.addEventListener('pointerup',function(e){if(x0==null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>70){go(dx<0?1:-1);}});
})();
window.addEventListener('resize',function(){if(S.cur){fit(S.H);}});

/* ---------- شاشة القفل ---------- */
var cdT=null;
function lockScreen(res){
  setUI(false);show('sLock');
  var fan=$('fan');fan.innerHTML='';
  ['rose','sky','cream'].forEach(function(t,k){
    var e=LET.envelope({w:200,h:124,theme:t,seal:34});e.setFlapOpen(false);e.sealShow();
    e.el.style.transform='translate('+((k-1)*34)+'px,'+(Math.abs(k-1)*6)+'px) rotate('+((k-1)*12)+'deg)';e.el.style.zIndex=k;fan.appendChild(e.el);
    e.el.animate([{marginTop:'0px'},{marginTop:'-8px'},{marginTop:'0px'}],{duration:3200+k*500,iterations:Infinity,easing:'ease-in-out'});
  });
  $('lockP').textContent='فيه '+ar(res.count||0)+' رسالة مستنياكم جوه الصندوق. اللينك ده هيفتحها أوتوماتيك أول ما الوقت يجي.';
  var off=Date.parse(res.now)-Date.now(),target=Date.parse(res.unlockAt);
  function tick(){
    var ms=target-(Date.now()+off);
    if(ms<=0){clearInterval(cdT);init();return;}
    var s=Math.floor(ms/1000);
    $('cdD').textContent=ar(Math.floor(s/86400));$('cdH').textContent=ar(Math.floor(s%86400/3600));$('cdM').textContent=ar(Math.floor(s%3600/60));$('cdS').textContent=ar(s%60);
  }
  clearInterval(cdT);tick();cdT=setInterval(tick,1000);
}
$('lockBtn').onclick=function(){var b=$('lockBtn');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');LET.sfx.tick();toast('لسه بدري 😄 استنوا بعد الفرح');};

/* ---------- تشغيل ---------- */
function pinGate(msg){
  setUI(false);show('sPin');
  $('pinErr').textContent=msg||'';
  var inp=$('pinInput'),btn=$('pinGo');
  inp.value='';inp.disabled=false;btn.disabled=false;
  setTimeout(function(){try{inp.focus();}catch(e){}},150);
}
function start(pin,remember){
  show('sLoad');
  var f=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load('17px "Aref Ruqaa"'),sleep(1800)]):Promise.resolve();
  Promise.all([loadData(pin),f]).then(function(r){
    var res=r[0];
    if(!res||!res.ok)throw new Error((res&&res.error)||'failed');
    if(remember){PIN=pin;try{sessionStorage.setItem(PIN_KEY,pin);}catch(e){}}
    if(res.locked){lockScreen(res);return;}
    S.msgs=res.messages||[];
    if(!S.msgs.length){setUI(false);show('sEmpty');return;}
    hideAll();setUI(true);S.i=0;build(0);label();S.busy=true;setBtn();
    enter(1).then(function(){S.busy=false;setBtn();});
  }).catch(function(e){
    var m=String(e&&e.message||e);
    if(m==='bad_pin'){
      PIN='';try{sessionStorage.removeItem(PIN_KEY);}catch(e){}
      pinGate('الـPIN غلط، جرّب تاني.');
      return;
    }
    if(m==='noapi')fail('اللينك ناقص','مفيش رابط للشيت. افتح اللينك اللي اتبعتلك بالظبط (فيه #k=… و e=…).');
    else if(m==='nokey')fail('اللينك ناقص المفتاح','اطلب اللينك الصح من اللي جهّز الدعوة.');
    else if(m==='unauthorized')fail('المفتاح غلط','اللينك ده مش مطابق للشيت.');
    else fail('مش قادرين نفتح الصندوق','جرّب تعمل ريفريش. ('+m+')');
  });
}
function init(){
  if(DEMO||!KEY){start('',false);return;}
  if(PIN){start(PIN,false);return;}
  pinGate('');
}
$('pinGo').onclick=function(){
  var v=String($('pinInput').value||'').replace(/\D/g,'');
  if(v.length!==4){$('pinErr').textContent='اكتب 4 أرقام.';return;}
  $('pinGo').disabled=true;
  start(v,true);
};
$('pinInput').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('pinGo').click();}});
setUI(false);init();
})();
</script>
